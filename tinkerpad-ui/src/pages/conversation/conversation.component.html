<header>
  <div class="title">TinkerPad</div>
  <div class="subtitle">Conversation Name Goes Here</div>
</header>

<main>
  <div class="sources-nav">
    <div class="section-header">
      <div class="section-title">Knowledge Sources</div>
      <button mat-icon-button>
        <mat-icon>upload</mat-icon>
      </button>
    </div>
    <div class="section-body">
      @for (item of knowledgeSources; track item) {
      <tp-knowledge-source-item [item]="item"></tp-knowledge-source-item>
      }
    </div>
  </div>
  <div class="messages-view">
    <div class="container">
      @for (message of messages; track message.id) {
      <tp-message [message]="message"></tp-message>
      }
    </div>

    <div class="composer">
      <div class="input">
        <textarea
          cdkTextareaAutosize
          (keypress)="handleMessageKeyPress($event)"
          [(ngModel)]="userMessage"
          placeholder="Type your message here..."
        ></textarea>
      </div>
      <div class="actions">
        <button mat-stroked-button [disabled]="!this.userMessage" (click)="sendUserMessage()">
          Send
          <mat-icon iconPositionEnd>send</mat-icon>
        </button>
      </div>
    </div>
  </div>
</main>
